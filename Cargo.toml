[package]
name = "emap"
version = "0.2.0"
edition = "2024"

[features]
default = ["tokio", "caching"]
tokio = ["dep:tokio", "dep:reqwest"]
caching = ["tokio", "tokio/fs", "dep:bytes"]
# Egui paint-callback integration. Pulls in `egui` and `egui-wgpu` and
# exposes the `emap::egui_wgpu` module with the EmapHandle helper.
egui-wgpu = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
wgpu = "29"
bytemuck = { version = "1.18", features = ["derive"] }
glam = { version = "0.32", features = ["bytemuck"] }
lyon = "1.0"
geo = { version = "0.33", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
bytes = { version = "1.10", optional = true }
tracing = "0.1"
egui = { version = "0.34", optional = true }
egui-wgpu = { version = "0.34", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, optional = true, features = [
    "http2",
    "rustls",
    "rustls-native-certs",
] }
tokio = { version = "1", optional = true, default-features = false, features = [
    "rt-multi-thread",
    "net",
    "time",
] }

[dev-dependencies]
winit = "0.30"
pollster = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }

[[example]]
name = "winit"
path = "examples/winit.rs"

[[example]]
name = "eframe"
path = "examples/eframe.rs"
required-features = ["egui-wgpu"]

[[example]]
name = "mapbox"
path = "examples/mapbox.rs"
required-features = ["egui-wgpu", "caching"]
